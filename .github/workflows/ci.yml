name: ci
on: [push, pull_request]
jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pytest pydantic pydantic-settings httpx numpy
      - run: pip install -r services/voice/requirements.txt || echo "optional voice deps skipped"
      - run: PYTHONPATH=services/voice/src pytest services/voice/tests -q
